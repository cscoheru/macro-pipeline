# Macro data source registry.
# Add a source -> add config here + a processor hook in run.py dispatch table.

# ============================================================
# 美国 (Phase 1) — FRED CSV
# ============================================================
fred:
  economy: us
  enabled: true
  series:
    - {id: FEDFUNDS,  name: "联邦基金利率",      unit: "%",        display: level}
    - {id: CPIAUCSL,  name: "CPI (headline)",   unit: "指数",      display: yoy}
    - {id: PCEPI,     name: "PCE 物价指数",     unit: "指数",      display: yoy}
    - {id: PAYEMS,    name: "非农就业",         unit: "千人",      display: level}
    - {id: UNRATE,    name: "失业率",           unit: "%",        display: level}
    - {id: GDPC1,     name: "实际GDP",          unit: "2017=100",  display: yoy}
    - {id: GFDEBTN,   name: "联邦债务总额",     unit: "百万$",     display: yoy}
    - {id: FYFSD,     name: "联邦财政赤字(财年)", unit: "百万$",     display: level}

# ============================================================
# 中国 (Phase 3) — HTML 发布稿 (listing -> discover -> parse)
# 每源单独 parser；解析失败告警不崩
# ============================================================
cn_mof:
  economy: cn
  enabled: true
  type: cn_release
  listing_url: "http://www.mof.gov.cn/gkml/caizhengshuju/"
  title_regex: '2026年.*财政收支情况'
  parser: parse_mof_fiscal
  # metrics 由 parser 返回；这里仅列示便于核对
  metric_keys: [mof_revenue, mof_expenditure, mof_central_exp, mof_local_exp, mof_govfund_rev, mof_govfund_exp, mof_land]

cn_stats_inv:
  economy: cn
  enabled: true
  type: cn_release
  listing_url: "https://www.stats.gov.cn/sj/zxfb/"
  title_regex: '全国固定资产投资基本情况'
  parser: parse_stats_investment
  metric_keys: [inv_total, inv_infra, inv_private]

cn_stats_cpi:
  economy: cn
  enabled: true
  type: cn_release
  listing_url: "https://www.stats.gov.cn/sj/zxfb/"
  title_regex: '居民消费价格同比'
  parser: parse_stats_cpi
  metric_keys: [cpi_yoy]

cn_stats_ppi:
  economy: cn
  enabled: true
  type: cn_release
  listing_url: "https://www.stats.gov.cn/sj/zxfb/"
  title_regex: '工业生产者出厂价格同比'
  parser: parse_stats_ppi
  metric_keys: [ppi_yoy]

cn_stats_pmi:
  economy: cn
  enabled: true
  type: cn_release
  listing_url: "https://www.stats.gov.cn/sj/zxfb/"
  title_regex: '采购经理指数运行情况'
  parser: parse_stats_pmi
  metric_keys: [pmi_mfg]

cn_pbc:
  economy: cn
  enabled: true
  type: cn_release
  listing_url: "http://www.pbc.gov.cn/diaochatongjisi/116219/index.html"
  title_regex: '2026年.*金融统计数据报告'
  parser: parse_pbc_financial
  metric_keys: [pbc_m2, pbc_m1, pbc_tsfs]

# cn_customs (海关进出口) — 延期：customs.gov.cn 被 WAF 锁死(412)，需 browse daemon 或付费镜像

# ============================================================
# 日本 (Phase 4) — BOJ / Statistics Bureau / Cabinet Office
# BOJ CGPI + MPM、CAO GDP 月度发布稿均为 PDF；cn_release 流程已扩展
# （fetcher.discover_pdf + pdf_to_text 自动接 .pdf URL）
# ============================================================
jp_ppi:
  economy: jp
  enabled: true
  type: cn_release
  listing_url: "https://www.boj.or.jp/en/statistics/pi/cgpi_release/index.htm"
  # BOJ 链接文本形如 "[PDF 218KB]" 完全一样；用 href 锚定最新月度发布 cgpiYYMM.pdf
  title_regex: '\[\s*PDF'
  href_regex: 'cgpi\d{4}\.pdf'
  parser: parse_jp_ppi
  metric_keys: [cgpi_yoy, cgpi_mom]

jp_policy:
  economy: jp
  enabled: true
  type: cn_release
  # Stable aggregator; fetcher.resolve_year_index redirects to state_YYYY/
  # so the current year is never hardcoded (would otherwise silently stale in Jan).
  listing_url: "https://www.boj.or.jp/en/mopo/mpmdeci/state_all/index.htm"
  year_index: true
  title_regex: 'Statement on Monetary Policy'
  href_regex: 'mpr_\d{4}/k\d{6}a\.pdf'   # 只挑利率决议 PDF（kYYMMDDa.pdf），跳过 outlook/opinion
  parser: parse_jp_policy
  metric_keys: [policy_rate]

jp_cpi:
  economy: jp
  enabled: false   # 延期：e-Stat 英文版无月度发布稿 HTML（仅有说明页 + Japanese-only 原始页）。
                   # 若需要，可后续接 OECD.stat API（Japan CPI/CORE）替代
  type: cn_release
  listing_url: "https://www.stat.go.jp/english/data/cpi/"
  title_regex: 'Monthly Report'
  parser: parse_jp_cpi
  metric_keys: [cpi_yoy, cpi_core_yoy]

jp_unrate:
  economy: jp
  enabled: false   # 延期：同上（e-Stat Labour Force Survey 月度发布稿仅 Japanese）
  type: cn_release
  listing_url: "https://www.stat.go.jp/english/data/roudou/"
  title_regex: 'Labour Force Survey'
  parser: parse_jp_unrate
  metric_keys: [unrate]

jp_gdp:
  economy: jp
  enabled: true
  type: cn_release
  # 三跳链: sokuhou_top(固定) → gdemenue{quarter}(每季换) → main_1e.pdf(固定路径,每季覆盖)
  # hops 元素为 [title_regex, href_regex]
  listing_url: "https://www.esri.cao.go.jp/en/sna/sokuhou/sokuhou_top.html"
  hops:
    - ['Time series table', 'gdemenuea\.html']
    - ['GDP \(Expenditure Approach\)', 'main_1e\.pdf']
  parser: parse_jp_gdp
  metric_keys: [gdp_qoq, gdp_yoy]

# ============================================================
# 德国 (Phase 5) — Destatis 英文 Press releases
# Pressesuche 是稳定入口，按 topic code 区分（611=CPI/811=GDP/132=Labour/61281=PPI）
# 最新 4 条 release 已验证 URL 形如 EN/Press/2026/08/PE26_283_611.html
# ============================================================
de_cpi:
  economy: de
  enabled: true
  type: cn_release
  listing_url: "https://www.destatis.de/SiteGlobals/Forms/Suche/Presse/EN/Pressesuche_Formular.html"
  href_base: "https://www.destatis.de/"   # Pressesuche hrefs "EN/Press/..." want site-root join
  # Destatis press 标题形如 "Inflation rate at +2.8% in July 2026"
  title_regex: 'Inflation rate'
  href_regex: 'PE26_\d+_611\.html'
  parser: parse_de_cpi
  metric_keys: [cpi_yoy, cpi_mom]

de_ppi:
  economy: de
  enabled: true
  type: cn_release
  listing_url: "https://www.destatis.de/SiteGlobals/Forms/Suche/Presse/EN/Pressesuche_Formular.html"
  href_base: "https://www.destatis.de/"
  # Erzeugerpreise → "Wholesale prices in July 2026: +5.3%"
  title_regex: 'Wholesale prices'
  href_regex: 'PE26_\d+_61281\.html'
  parser: parse_de_ppi
  metric_keys: [ppi_yoy, ppi_mom]

de_unrate:
  economy: de
  enabled: true
  type: cn_release
  listing_url: "https://www.destatis.de/SiteGlobals/Forms/Suche/Presse/EN/Pressesuche_Formular.html"
  href_base: "https://www.destatis.de/"
  # Employment → "Employment in June 2026 down on the previous month"
  title_regex: 'Employment'
  href_regex: 'PE26_\d+_132\.html'
  parser: parse_de_unrate
  metric_keys: [employment_yoy]

de_gdp:
  economy: de
  enabled: true
  type: cn_release
  listing_url: "https://www.destatis.de/SiteGlobals/Forms/Suche/Presse/EN/Pressesuche_Formular.html"
  href_base: "https://www.destatis.de/"
  # GDP → "Gross domestic product in the 2nd quarter of 2026 up 0.2%"
  title_regex: 'Gross domestic product'
  href_regex: 'PE26_\d+_811\.html'
  parser: parse_de_gdp
  metric_keys: [gdp_qoq, gdp_yoy]

# 后续 Phase 3 扩展：
#   cn_stats_cpi  (统计局 CPI/PPI)
#   cn_stats_pmi  (统计局 PMI)
#   cn_pbc        (央行 M2/M1/社融)
#   cn_customs    (海关进出口)

# ============================================================
# 框架触发规则 — 每次跑后评估，命中的 flag 附进 待解读 简报
# 单指标规则(safe, 无 eval)；跨序列(如M2-CPI背离)留 Phase 2/3 扩展
# ============================================================
triggers:
  # --- 美国 (Phase 1) ---
  - id: us_unrate_jump
    flag: "F2/F5 美国就业恶化（财政主导副作用观察）"
    metric: {source: fred, series: UNRATE, field: value}
    op: gt
    threshold: 4.5
    note: "失业率 > 4.5%"
  - id: us_ffr_high
    flag: "F2 货币仍紧（财政主导：高利率压债息）"
    metric: {source: fred, series: FEDFUNDS, field: value}
    op: gt
    threshold: 3.75
    note: "联邦基金利率 > 3.75%（加息方向压力）"
  # --- 中国 (Phase 3) ---
  - id: cn_local_exp_neg
    flag: "F6 政绩观跟踪（地方支出转负）"
    metric: {source: cn_mof, series: mof_local_exp, field: yoy_pct}
    op: lt
    threshold: 0
    note: "地方一般公共预算支出同比 < 0（基建/资本开支被压）"
  - id: cn_inv_infra_neg
    flag: "F6 基建投资转负（政绩观窗口持续）"
    metric: {source: cn_stats_inv, series: inv_infra, field: yoy_pct}
    op: lt
    threshold: 0
    note: "基础设施投资累计同比 < 0"
  - id: cn_land_collapse
    flag: "F3/F4 土地财政恶化（房地产蓄水池破裂，关联 M2 之谜）"
    metric: {source: cn_mof, series: mof_land, field: yoy_pct}
    op: lt
    threshold: -20
    note: "土地出让收入同比 < -20%"
  # --- 跨序列触发 (Phase 2) — 对缓存最新值做组合判断；仅当某组成序列本轮有新数据时评估 ---
  - id: cn_two_valves
    type: cross
    flag: "F1流速/F4两阀门（M2−CPI 背离扩大：货币冻在账上）"
    expr: {a: {source: cn_pbc, series: pbc_m2, field: yoy_pct}, op: minus, b: {source: cn_stats_cpi, series: cpi_yoy, field: yoy_pct}}
    compare: {op: gt, threshold: 5}
    note: "M2同比 − CPI同比 > 5pp"
  - id: cn_velocity_collapse
    type: cross
    flag: "F1 流通速度下降（M2增速远超M1：钱在定期化）"
    expr: {a: {source: cn_pbc, series: pbc_m2, field: yoy_pct}, op: minus, b: {source: cn_pbc, series: pbc_m1, field: yoy_pct}}
    compare: {op: gt, threshold: 3}
    note: "M2同比 − M1同比 > 3pp"
  # --- 日本 (Phase 4) ---
  - id: jp_cpi_target
    flag: "JP 物价偏离 BOJ 2% 目标"
    metric: {source: jp_cpi, series: cpi_core_yoy, field: yoy_pct}
    op: range
    threshold: [0.5, 2.5]
    invert: true   # outside range = hit
    note: "核心CPI同比 落在 [0.5, 2.5] 之外（BOJ 2% 目标窗口偏离）"
  - id: jp_unrate_jump
    flag: "JP 劳动市场恶化（完全失業率）"
    metric: {source: jp_unrate, series: unrate, field: value}
    op: gt
    threshold: 2.8
    note: "完全失業率 > 2.8%（历史均值附近）"
  - id: jp_policy_exit
    flag: "JP 货币政策正常化推进（BOJ 利率非零）"
    metric: {source: jp_policy, series: policy_rate, field: value}
    op: gt
    threshold: 0
    note: "无担保隔夜拆借利率目标 > 0%（YCC 退出后）"
  # --- 德国 (Phase 5) ---
  - id: de_cpi_target
    flag: "DE 物价偏离 ECB 2% 目标"
    metric: {source: de_cpi, series: cpi_yoy, field: yoy_pct}
    op: range
    threshold: [0.5, 2.5]
    invert: true
    note: "CPI同比 落在 [0.5, 2.5] 之外（ECB 2% 目标窗口偏离）"
  - id: de_unrate_jump
    flag: "DE 劳动市场恶化（就业人数同比下行）"
    metric: {source: de_unrate, series: employment_yoy, field: yoy_pct}
    op: lt
    threshold: 0
    note: "就业人数同比变化 < 0"
  - id: de_gdp_qoq_neg
    flag: "DE 经济活动萎缩"
    metric: {source: de_gdp, series: gdp_qoq, field: yoy_pct}
    op: lt
    threshold: 0
    note: "实际 GDP 环比 < 0%（未经季调折年率修正，与发布稿原值口径）"

# ============================================================
# 自动洞察 feature flag
#   enabled: false      采集照常，但不生成/发布洞察文章（恢复旧简报行为）
#   auto_publish: true  验证通过后自动 PUT 到 vault 洞察/；不达标的仍进待审/，人工判断
# 上线步骤见 plans/eager-snacking-micali.md Phase E；密钥在 config/insight.env（600）
# ============================================================
insights:
  enabled: true
  auto_publish: true
